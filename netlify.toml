[build]
  command = "node netlify/build-preview.mjs"
  publish = "chat-preview-dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/chat/panel-public.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://sakireemsolutions.com https://www.sakireemsolutions.com http://localhost:8001"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/chat/panel.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
